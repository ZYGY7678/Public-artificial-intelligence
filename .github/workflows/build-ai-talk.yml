name: Build AI Talk Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'ai-talk-android/**'
      - '.github/workflows/build-ai-talk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-29" "build-tools;29.0.3"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '6.7.1'
      - name: Assemble debug APK
        working-directory: ai-talk-android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Talk-Qin1S-debug
          path: ai-talk-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
