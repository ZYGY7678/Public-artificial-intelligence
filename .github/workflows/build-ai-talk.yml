name: Build AI Talk Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'ai-talk-android/**'
      - '.github/workflows/build-ai-talk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      # sdkmanager shipped on GitHub's Ubuntu runner needs JDK 17.
      - name: Set up JDK 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Avoid android-actions/setup-android: its legacy "tools" package
      # is no longer published and causes the setup action to fail.
      - name: Accept Android SDK licenses and install required packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-29" "build-tools;29.0.3"

      # AGP 4.2.2 / Gradle 6.7.1 are kept on JDK 11.
      - name: Set up JDK 11 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '6.7.1'

      - name: Train compact Hebrew ML intent model
        run: python3 ai-talk-android/tools/train_intent_model.py

      - name: Assemble debug APK
        working-directory: ai-talk-android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          test -s ai-talk-android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh ai-talk-android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Talk-Qin1S-debug
          path: ai-talk-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
